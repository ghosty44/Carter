<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4CAF50" />
  <meta name="description" content="Générateur de listes de courses aléatoires" />
  <title>Liste de Courses</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🛒 Liste de Courses</h1>
    <p class="subtitle">Génère ta liste aléatoirement</p>
  </header>

  <main>
    <section class="controls">
      <label for="category">Catégorie</label>
      <select id="category">
        <option value="all">Toutes</option>
        <option value="fruits">Fruits & Légumes</option>
        <option value="dairy">Produits Laitiers</option>
        <option value="meat">Viandes & Poissons</option>
        <option value="bakery">Boulangerie</option>
        <option value="drinks">Boissons</option>
        <option value="snacks">Snacks & Épicerie</option>
        <option value="hygiene">Hygiène & Maison</option>
      </select>

      <label for="count">Nombre d'articles</label>
      <input type="range" id="count" min="3" max="20" value="8" />
      <span id="count-display">8</span>

      <button id="generate-btn" class="btn-primary">
        🎲 Générer une liste
      </button>
    </section>

    <section class="list-section" id="list-section" hidden>
      <div class="list-header">
        <h2>Ma liste</h2>
        <div class="list-actions">
          <button id="copy-btn" class="btn-icon" title="Copier">📋</button>
          <button id="clear-btn" class="btn-icon" title="Effacer tout">🗑️</button>
        </div>
      </div>

      <ul id="shopping-list"></ul>

      <div class="add-custom">
        <input type="text" id="custom-item" placeholder="Ajouter un article…" />
        <button id="add-btn" class="btn-secondary">+</button>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <footer>
    <p>Fonctionne hors-ligne ✓</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
